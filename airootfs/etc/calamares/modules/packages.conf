# Configuration for packages module
# Configuración del módulo de paquetes para Atomic Linux
---
backend: pacman
skip_if_no_internet: false
update_db: false
update_system: false

pacman:
    num_retries: 0
    disable_download_timeout: false
    needed_only: false

operations:
  - try_remove:
      - calamares
      - mkinitcpio-archiso
      - squashfs-tools
      - kpmcore
      - yaml-cpp
      - ckbcomp
