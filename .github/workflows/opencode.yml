name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
    env:
      OPENCODE_MODEL: "Gemma 4 31B IT"
      API_KEY: "${{ secrets.AQ.Ab8RN6LEcgyWQ2GQdgPW6VLx7IiTUAPyzxo3TvUG-cpfGjeL0A }}"

